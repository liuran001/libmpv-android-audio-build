name: probe-actions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-22.04
    steps:
      - name: Echo runner info
        run: |
          echo "actions-ok"
          uname -a
          echo "runner=${{ runner.os }} arch=${{ runner.arch }}"
